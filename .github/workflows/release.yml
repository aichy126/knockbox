name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: goreleaser/goreleaser-action@v6
        with: { version: "~> v2", args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    # secrets 只能在 job 级 env 里取：step 的 if 读不到 secrets 上下文，
    # 写成 if: secrets.X 会让整份 workflow 在启动阶段解析失败。
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      # arm64 也要出镜像：自建推送服务端跑在 ARM 小机器上是常态。
      # 编译本身是交叉编译（Dockerfile 里按 TARGETARCH 编，CGO_ENABLED=0 所以零成本），
      # QEMU 只用来跑 runtime 那一层的 apk add。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 是可选的：没配这两个 secret 就只推 ghcr，
      # fork 出去的仓库打 tag 不会因为登录失败而整条挂掉。
      - name: 决定推哪些 registry
        id: reg
        run: |
          images="ghcr.io/${{ github.repository }}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="$images
          docker.io/$DOCKERHUB_USERNAME/knockbox"
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.reg.outputs.images }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
