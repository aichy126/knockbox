name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      # 管理界面要先构建。goreleaser 只编 Go——不构建的话 go:embed 收进去的是
      # 一个空目录，发出去的二进制后台是一片空白，而这一步照样绿。
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - uses: goreleaser/goreleaser-action@v7
        with: { version: "~> v2", args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      # arm64 也要出镜像：自建推送服务端跑在 ARM 小机器上是常态。
      # 编译本身是交叉编译（Dockerfile 里按 TARGETARCH 编，CGO_ENABLED=0 所以零成本），
      # QEMU 只用来跑 runtime 那一层的 apk add。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Docker Hub 单独一个 job，而且不重新构建：ghcr 那份已经推成功的镜像，
  # 不该因为另一个 registry 的凭据出问题就一起作废。imagetools create 只搬
  # manifest，所以两个 registry 里的 digest 一定是同一个。
  #
  # 没配那两个 secret 就整段跳过 —— fork 出去打 tag 仍然能发到自己的 ghcr。
  mirror-to-docker-hub:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: docker/setup-buildx-action@v3
        if: env.DOCKERHUB_USERNAME != ''

      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 把 manifest 从 ghcr 复制过去
        if: env.DOCKERHUB_USERNAME != ''
        env:
          SRC_TAGS: ${{ needs.image.outputs.tags }}
        run: |
          printf '%s\n' "$SRC_TAGS" | while read -r src; do
            [ -n "$src" ] || continue
            # metadata-action 一行一个完整引用，取冒号后面那段当目标 tag
            docker buildx imagetools create \
              --tag "docker.io/$DOCKERHUB_USERNAME/knockbox:${src##*:}" "$src"
          done
