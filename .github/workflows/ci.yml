name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # 跟着 go.mod 走，别写死——写死了升级 Go 版本时会在 CI 上莫名其妙地挂
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # gofmt -l 对格式不对的文件会打出文件名；有输出就让这一步失败
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; echo "run: gofmt -w ."; exit 1; fi

      - run: go vet ./...

      # go.mod 必须是 tidy 过的：直接依赖被误标成 indirect 是 clone 下来第一眼就能看到的事
      - name: go mod tidy
        run: go mod tidy -diff

      # action 的大版本和 golangci-lint 的大版本是绑死的：v6 只吃 golangci-lint v1，
      # v7 起才是 v2。配置在 .golangci.yml，本地 `make lint` 跑的是同一份。
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # 竞态检测【需要 cgo】（macOS 上不带 cgo 也能跑，Linux 上会直接报错），
      # 所以这一步开着 cgo 跑。
      - run: go test ./... -race -cover

      # 另一件事：SQLite 走 modernc.org 纯 Go 驱动，关掉 cgo 也必须编得过——
      # 发布产物是静态二进制、Docker 镜像是 FROM alpine，都依赖这个前提。
      - run: CGO_ENABLED=0 go build ./...

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
        working-directory: admin
      - run: npm run test
        working-directory: admin
      - run: npm run build
        working-directory: admin
      # 构建产物真的进得了二进制。没有这一步，「embed 了一个空目录」
      # 在 CI 上和成功长得一模一样。
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      - name: 产物 embed 进去了
        run: |
          go build -o /tmp/kb .
          # 配置要写成真文件：加载器按扩展名认格式，进程替换给出的 /dev/fd/63 没有扩展名。
          sed -e 's|./data/|/tmp/kbdata/|g' -e 's|^address = ":8080"|address = ":18099"|' \
              config.toml.example > /tmp/kb.toml
          mkdir -p /tmp/kbdata   # SQLite 不会自己建目录
          /tmp/kb serve -c /tmp/kb.toml &
          for i in $(seq 1 30); do curl -fsS localhost:18099/health >/dev/null 2>&1 && break; sleep 1; done
          code=$(curl -s -o /tmp/admin.html -w '%{http_code}' localhost:18099/admin)
          test "$code" = 200 || { echo "GET /admin -> $code"; cat /tmp/admin.html; exit 1; }
          grep -q 'type="module"' /tmp/admin.html || { echo "/admin 回的不是构建好的前端"; cat /tmp/admin.html; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -t knockbox:ci .
      - name: 容器能起来并且自己建好库
        run: |
          docker run -d --name kb -p 18080:8080 knockbox:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:18080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs kb
          test -n "$ok"
